<style>
:root {
  --navy:#2f5d3a; --blue:#5f9f57; --sky:#eaf7e7; --cream:#fff8df;
  --ink:#24372a; --muted:#6f7e72; --line:#d8e7d8; --card:#fffef9;
  --shadow:0 10px 28px rgba(25,50,77,.10);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:linear-gradient(180deg,#eef8ea 0,#fffdf6 42%,#ffffff 100%);color:var(--ink);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",sans-serif;line-height:1.65}
button,a{font:inherit}
.hero{padding:28px 20px 20px;background:linear-gradient(135deg,#2f5d3a 0%,#5f9f57 55%,#9ac66d 100%);color:white}
.hero-inner{max-width:920px;margin:auto}
.kicker{font-size:.82rem;letter-spacing:.12em;opacity:.8}
h1{font-size:clamp(1.65rem,6vw,2.7rem);line-height:1.15;margin:.4rem 0}

.quick{display:flex;gap:8px;overflow-x:auto;padding:12px 14px;background:rgba(255,255,255,.96);
position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line);scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.day-chip{white-space:nowrap;border:1px solid #cbd9e3;background:#fff;border-radius:999px;padding:8px 13px;color:var(--navy);cursor:pointer}

main{max-width:920px;margin:auto;padding:18px 14px 110px}
.day-head{background:linear-gradient(145deg,#fffef9,#f1faee);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.day-no{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--blue);font-size:.92rem}

.theme{display:inline-block;background:linear-gradient(90deg,#e8f7df,#fff3b8);color:#3f7a3d;padding:5px 11px;border-radius:99px;font-size:.86rem;font-weight:700}
.summary{margin:14px 0 0;color:#475867}
.timeline{margin-top:18px;display:grid;gap:12px}
.item{display:grid;grid-template-columns:44px 1fr;gap:12px;background:var(--card);border:1px solid var(--line);

.icon{width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,#e8f7df,#fff2b5);display:grid;place-items:center;font-size:1.35rem;border:1px solid #d8eabf}
.item h3{margin:0 0 4px;font-size:1.03rem}
.item p{margin:0;color:#566672;font-size:.94rem}
.tips{margin-top:18px;background:var(--cream);border:1px solid #f0dfb9;border-radius:18px;padding:16px}
.tips h3{margin:0 0 8px;font-size:1rem}
.tips ul{margin:0;padding-left:1.2rem}
.map-btn{display:flex;justify-content:center;align-items:center;gap:8px;width:100%;margin-top:16px;
padding:13px;border-radius:14px;background:linear-gradient(90deg,#4f934f,#7abf63);color:white;text-decoration:none;font-weight:700;box-shadow:0 6px 16px rgba(79,147,79,.22)}
.pager{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);
border-top:1px solid var(--line);padding:10px max(12px,env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom));
display:grid;grid-template-columns:1fr auto 1fr;gap:9px}
.pager button{border:0;border-radius:14px;padding:12px 10px;cursor:pointer;font-weight:700}
.prev,.next{background:var(--navy);color:#fff}
.prev:disabled,.next:disabled{opacity:.35}
.home{background:#edf6e9;color:var(--navy);min-width:56px}
.note{margin-top:16px;color:var(--muted);font-size:.82rem;text-align:center}
.info-grid{display:grid;gap:10px;margin-top:16px}
.info-card{background:#f7fbeF;border:1px solid #d7e8c8;border-radius:15px;padding:12px 14px}
.info-card strong{display:block;color:#3f7a3d;margin-bottom:2px}
.transport{margin-top:16px;background:#eef8ff;border:1px solid #cfe4f1;border-radius:18px;padding:16px}
.transport h3{margin:0 0 8px;font-size:1rem;color:#315f78}
.transport ul{margin:0;padding-left:1.2rem}
@media(min-width:700px){.hero{padding:42px 24px 28px} main{padding-top:24px} .timeline{grid-template-columns:1fr 1fr}.item{min-height:150px} .quick{justify-content:center}}
@media print{.quick,.pager{display:none} main{max-width:none;padding:0} .day-head,.item{box-shadow:none}}
</style>

<script>
const days = [{"day":1,"date":"8/8（六）","title":"台北出發・抵達京都","theme":"航班＋機場交通＋入住","summary":"虎航15:15自台北起飛，17:00抵達關西機場。入境、領行李後搭JR關西機場特急HARUKA直達京都站，再前往京都住宿。","info":[["✈️ 去程航班","虎航｜台北 → 大阪關西機場｜15:15 → 17:00"],["🏨 京都住宿","8/8－8/11｜387-1 Shiogamachō, Shimogyo Ward, Kyoto 600-8103"]],"items":[["關西機場入境","17:00抵達後，預留約60至90分鐘辦理入境、領取行李與前往關西機場站。","🛬"],["HARUKA：關西機場 → 京都站","JR HARUKA可由關西機場直達京都站，適合帶行李的6人家庭。建議事先購買或抵達後於JR綠色售票機／售票處取票。","🚆"],["京都站 → 京都住宿","最省力方式是由京都站搭兩輛計程車，約10至15分鐘；大件行李多時不建議再轉地下鐵與步行。","🚕"],["入住與晚餐","預估約20:00前後抵達住宿。當晚以附近簡單用餐、購買飲水與隔日早餐為主。","🏨"]],"transport":["建議路線：關西機場站 → JR特急HARUKA → 京都站 → 計程車 → 住宿。","HARUKA屬特急列車，除基本車資外另需特急券；可使用指定席，6人同行更容易坐在一起。","若班機或入境延誤，直接搭下一班HARUKA即可，不要安排當晚固定預約。"],"tips":["京都住宿位於下京區塩竈町一帶，不是先前提到的七条站旁MONday Apart。","第一晚只安排入住，避免長輩在晚間拖行行李。"],"map_query":"387-1 Shiogamacho Shimogyo Ward Kyoto"},{"day":2,"date":"8/9（日）","title":"清水寺・花山天文台・京都咖啡","theme":"東山文化＋天文體驗","summary":"上午趁較涼爽時參觀清水寺，中午提早用餐，再搭計程車前往花山天文台。","info":[["🏨 出發地","京都住宿｜387-1 Shiogamachō, Shimogyo Ward"]],"items":[["住宿 → 清水寺","建議早上搭計程車直達清水坂或五条坂附近，6人分乘兩車，減少夏季步行與轉乘。","🚕"],["清水寺","建議開門後不久抵達，避開高溫與主要人潮。長輩可減少二年坂、三年坂的坡道行程。","⛩️"],["清水寺周邊午餐","建議10:30至11:30提早用餐，並請餐廳協助叫車。","🍱"],["清水寺 → 花山天文台","直接搭計程車上山最簡便；提醒司機由東山Driveway、阿含宗入口方向進入。","🔭"],["天文台 → 三條京阪","參觀後搭計程車下山至三條京阪／河原町一帶，再到LOB COFFEE HOUSE休息。","☕"],["返回住宿","三條京阪可搭京阪本線至清水五条，再步行或短程計程車回住宿。","🚇"]],"transport":["上午：住宿 → 計程車 → 清水寺。","中午：清水寺周邊 → 計程車 → 花山天文台。","下午：花山天文台 → 計程車 → 三條京阪；回程可搭京阪至清水五条。"],"tips":["6人同行可預約大型計程車，或分乘兩輛。","花山天文台入口較不直觀，出發前保留日文地址與官方交通說明。"],"map_query":"京都大学 花山天文台"},{"day":3,"date":"8/10（一）","title":"京都大學・錦市場・宇治","theme":"校園＋市場＋世界遺產","summary":"上午京都大學，接著到錦市場吃午餐，下午搭京阪前往宇治。","info":[["🏨 住宿最後一晚","京都住宿｜翌日8/11退房"]],"items":[["住宿 → 京都大學吉田校區","可由清水五条搭京阪至出町柳，再轉公車或計程車；6人同行建議最後一段搭計程車。","🎓"],["京都大學吉田校區","以鐘樓、校園公共區域與紀念品為主，建議停留60至75分鐘。","🏫"],["京都大學 → 錦市場","搭公車或計程車前往四条河原町／錦市場，避免多次轉乘。","🚕"],["錦市場","約10:30至12:00抵達最理想，可邊逛邊用餐。","🛍️"],["錦市場 → 宇治","步行至祇園四条站，搭京阪本線至中書島，轉京阪宇治線至宇治站。","🚆"],["平等院・宇治神社・宇治上神社","下午依序安排，並保留中村藤吉或其他宇治抹茶店的時間。","🏯"],["宇治 → 京都住宿","京阪宇治站 → 中書島轉車 → 清水五条站，再步行回住宿。","🚆"]],"transport":["最順鐵路主軸：清水五条／祇園四条 ↔ 京阪本線 ↔ 中書島 ↔ 京阪宇治線。","宇治回程不必繞京都站，直接搭京阪回清水五条較接近住宿。","當晚整理行李，若大阪住宿可代收，建議將大件行李宅配至大阪。"],"tips":["宇治行程至少保留4小時。","若上午延誤，優先保留平等院與宇治神社，京都大學縮短即可。"],"map_query":"平等院 宇治"},{"day":4,"date":"8/11（二）","title":"京都退房・勝尾寺・大阪入住","theme":"跨城移動＋北大阪","summary":"京都退房後先往新大阪與箕面萱野，再前往勝尾寺；參觀後沿御堂筋線南下至大國町入住。","info":[["🏨 京都退房","387-1 Shiogamachō｜8/11退房"],["🏨 大阪住宿","8/11－8/15｜大国1-2-22, 浪速區, 大阪 556-0014"]],"items":[["京都住宿 → 京都站","有行李時建議兩輛計程車；避免先拖行李搭公車或地下鐵。","🚕"],["京都站 → 新大阪站","搭JR京都線新快速，約25分鐘；不需搭新幹線。","🚆"],["新大阪 → 箕面萱野","於新大阪轉大阪Metro御堂筋線，列車直通北大阪急行，可直達箕面萱野。","🚇"],["箕面萱野 → 勝尾寺","轉阪急巴士或兩輛計程車；假日若排隊長，計程車較穩妥。","🔴"],["勝尾寺 → 大國町","返回箕面萱野後，搭北大阪急行／御堂筋線直達大國町，不需換車。","🚇"],["入住大阪住宿","大國町站下車後前往大国1-2-22。帶行李時請依住宿指示選擇最近出口。","🏨"],["象印食堂","休息後搭御堂筋線一站至難波，前往象印食堂大阪本店。","🍚"]],"transport":["建議主線：京都站 → JR京都線新快速 → 新大阪 → 御堂筋線／北大阪急行 → 箕面萱野。","勝尾寺回程：箕面萱野 → 御堂筋線直達大國町。","若行李未宅配，可在新大阪寄放；不要先繞到大國町再北上勝尾寺。"],"tips":["8/11為日本國定假日「山之日」，車站與巴士可能較擁擠。","勝尾寺有坡道，長輩不必走完整個境內。"],"map_query":"大国1-2-22 大阪"},{"day":5,"date":"8/12（三）","title":"神戶防災與藝術","theme":"深度學習日","summary":"由大國町前往神戶HAT地區，參觀人與防災未來中心及兵庫縣立美術館。","info":[["🏨 出發地","大阪住宿｜大國町站附近"]],"items":[["大國町 → 大阪梅田","搭御堂筋線至梅田。","🚇"],["大阪 → 灘／岩屋","可轉JR神戶線至灘站，或阪神線至岩屋站。","🚆"],["人與防災未來中心","建議上午參觀，保留約2小時。","🏢"],["兵庫縣立美術館","兩館距離近，午餐後步行前往。","🎨"],["三宮／元町","若體力足夠，再前往三宮或元町簡單散步、晚餐。","🌆"],["返回大阪","由三宮搭JR／阪神回大阪，再轉御堂筋線至大國町。","🚇"]],"transport":["去程：大國町 → 御堂筋線 → 梅田／大阪站 → JR神戶線至灘，或阪神線至岩屋。","回程：神戶三宮 → 大阪梅田 → 御堂筋線 → 大國町。"],"tips":["HAT神戶兩館可步行銜接。","美術館展覽與休館資訊，出發前再次確認。"],"map_query":"兵庫県立美術館"},{"day":6,"date":"8/13（四）","title":"大阪科學館・水上巴士・梅田","theme":"科學＋水都","summary":"上午大阪市立科學館，下午搭Aqua-Liner，傍晚到梅田吃HARBS。","info":[["🏨 出發地","大阪住宿｜大國町站附近"]],"items":[["大國町 → 肥後橋","搭四橋線可由大國町直達肥後橋，步行前往大阪市立科學館。","🚇"],["大阪市立科學館","先確認星象館場次，並預留展示場參觀時間。","🪐"],["中之島午餐","在科學館或中之島周邊用餐。","🍽️"],["大阪水上巴士 Aqua-Liner","依預約船班前往淀屋橋、八軒家濱或大阪城港。","🚤"],["HARBS 大丸梅田店","水上巴士後前往梅田，6人可能需候位或分桌。","🍰"],["梅田 → 大國町","搭御堂筋線直達大國町。","🚇"]],"transport":["去程最簡單：大國町 → 四橋線直達肥後橋。","回程最簡單：梅田 → 御堂筋線直達大國町。"],"tips":["先鎖定星象館場次，再反推水上巴士時間。","這天交通集中在中之島與梅田。"],"map_query":"大阪市立科学館"},{"day":7,"date":"8/14（五）","title":"丹後海上列車・天橋立・伊根舟屋一日遊","theme":"Klook大阪出發｜10小時中文／英文團","summary":"參加Klook大阪出發的併團一日遊，搭乘京都丹後鐵道「海上列車」，前往天橋立與伊根舟屋。活動標示約10小時，實際集合時間、地點、導遊與車牌將由供應商於前一日21:00前通知。","info":[["🎫 Klook活動","丹後海上列車＋天橋立＋伊根舟屋一日遊｜大阪出發｜約10小時"],["🗣️ 導覽語言","中文／英文導遊｜併團行程"],["📩 集合通知","8/13日本時間21:00前，由供應商以電子郵件通知集合時間、地點、導遊與車牌"]],"items":[["前一晚 21:00前｜確認集合通知","檢查電子郵件與垃圾郵件匣，確認8/14集合地點、集合時間、導遊姓名及車牌；若收到多封，以最後一封為準。","📩"],["集合時間前15分鐘｜抵達大阪集合點","本行程為併團服務，不等待遲到旅客。由大國町住宿前往集合點的交通，待憑證公布地點後再以Google Maps確認。","⏰"],["上午｜大阪出發前往西舞鶴","搭乘旅遊車前往京都北部。全程約10小時，實際時間會受交通、天候與人流影響。","🚌"],["上午至中午｜京都丹後鐵道海上列車","於西舞鶴站搭乘前往天橋立方向的列車，通過由良川橋時可欣賞列車行駛於海面般的景觀。","🚆"],["中午至下午｜天橋立","參觀日本三景之一的天橋立；依所購方案可搭乘吊椅／纜車前往展望台。用餐通常安排在此區域，實際停留時間以導遊通知為準。","🌊"],["下午｜伊根舟屋","前往伊根漁村欣賞舟屋景觀；依所購方案可搭伊根灣遊船，航程約25分鐘，並可能體驗餵食海鷗。","⛵"],["約出發後10小時｜返回大阪","長途交通可能因塞車延後，當晚不安排需準時報到的餐廳或活動。","🚌"]],"transport":["這不是私人包車，而是大阪出發的併團一日遊；實際集合點需依8/13晚間供應商通知。","供應商可能依人數安排4至13人小團（司機兼導遊），或14至45人巴士團（司機＋導遊）。","若每人攜帶超過1件行李，可能需現場加收費用；本日建議只帶隨身包。","行程順序可能因交通、天候、假日人潮及鐵路運行調整。"],"tips":["建議選擇含海上列車、天橋立吊椅／纜車與伊根灣遊船票的完整方案；最終以訂單方案為準。","前一晚務必確認電子郵件，集合點一旦確認不要臨時更換。","當日請提早15分鐘抵達，併團行程不等候遲到旅客。","8月中旬日照強，準備帽子、飲水、防曬及暈車藥。"],"map_query":"Amanohashidate Ine Funaya","activity_url":"https://www.klook.com/zh-TW/activity/170905-tango-railway-amanohashidate-ine-no-funaya-one-day-tour/"},{"day":8,"date":"8/15（六）","title":"大阪退房・關西機場・返台","theme":"退房＋機場交通＋回程航班","summary":"星宇15:10由大阪關西機場起飛，建議中午前抵達機場。由大國町前往南海難波，再搭南海特急Rapi:t至關西機場。","info":[["✈️ 回程航班","星宇｜大阪關西機場 → 台北｜15:10 → 17:05"],["🏨 大阪退房","大国1-2-22｜8/15退房"]],"items":[["退房","建議09:30前完成整理，10:15至10:30左右離開住宿。","🧳"],["大國町 → 南海難波","行李較多時，6人分乘兩輛計程車直達南海難波站最省力；也可搭御堂筋線一站至難波。","🚕"],["南海難波 → 關西機場","搭南海特急Rapi:t，全車指定席，最快約34分鐘。建議選擇約11:00前後班次，並預先劃位。","🚆"],["抵達關西機場","以12:00左右抵達為目標，預留約3小時辦理報到、托運、安檢與出境。","🛫"],["星宇返台","15:10起飛，17:05抵達台北。","✈️"]],"transport":["建議路線：大阪住宿 → 計程車／御堂筋線 → 南海難波 → 特急Rapi:t → 關西機場。","Rapi:t為全車指定席，車票通常可於搭乘日前一個月起購買。","最晚不要把抵達機場時間壓到起飛前2小時；6人加長輩建議保留約3小時。"],"tips":["當天不再安排黑門市場等正式景點，避免行李與時間壓力。","出發前一週再以南海官方時刻表確認實際班次。"],"map_query":"関西空港"}];
let current = Number(location.hash.replace('#day','')) || 1;
if(current < 1 || current > 8) current = 1;
const app = document.getElementById('app');
const quick = document.getElementById('quick');
const prev = document.getElementById('prev');
const next = document.getElementById('next');
function renderChips(){quick.innerHTML = days.map(d => `<button class="day-chip ${d.day===current?'active':''}" data-day="${d.day}">D${d.day}・${d.date}</button>`).join('');quick.querySelectorAll('button').forEach(b => b.onclick = () => go(Number(b.dataset.day)));const active = quick.querySelector('.active');active?.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});}
function render(){const d = days[current-1];document.title = `第${d.day}天 ${d.title}｜京都大阪八日自由行`;app.innerHTML = `<section class="day-head"><div class="day-no">DAY ${d.day} <span>｜</span> ${d.date}</div><h2>${d.title}</h2><span class="theme">${d.theme}</span><p class="summary">${d.summary}</p>${d.info && d.info.length ? `<div class="info-grid">${d.info.map(x=>`<div class="info-card"><strong>${x[0]}</strong><span>${x[1]}</span></div>`).join('')}</div>` : ''}</section><section class="timeline">${d.items.map(x => `<article class="item"><div class="icon">${x[2]}</div><div><h3>${x[0]}</h3><p>${x[1]}</p></div></article>`).join('')}</section>${d.transport && d.transport.length ? `<section class="transport"><h3>2026交通規劃</h3><ul>${d.transport.map(t=>`<li>${t}</li>`).join('')}</ul></section>` : ''}<section class="tips"><h3>當日提醒</h3><ul>${d.tips.map(t=>`<li>${t}</li>`).join('')}</ul></section>${d.activity_url ? `<a class="map-btn" target="_blank" rel="noopener" href="${d.activity_url}" style="background:linear-gradient(90deg,#e46d2e,#f09a43)">🎫 開啟 Klook 活動頁面</a>` : ''}<a class="map-btn" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(d.map_query)}">📍 在 Google Maps 開啟主要地點</a><p class="note">行程時間仍應依預約、店休、交通與長輩當日體力彈性調整。</p>`;prev.disabled = current===1;next.disabled = current===8;renderChips();window.scrollTo({top:0,behavior:'smooth'});}
function go(n){if(n<1||n>8) return;current=n;history.replaceState(null,'',`#day${n}`);render();}
prev.onclick=()=>go(current-1);next.onclick=()=>go(current+1);document.getElementById('home').onclick=()=>go(1);window.addEventListener('hashchange',()=>{const n=Number(location.hash.replace('#day',''));if(n>=1&&n<=8){current=n;render();}});render();
</script>
