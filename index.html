<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>即時互動平台</title>
  <style>
    body{margin:0;font-family:sans-serif;background:#0b1020;color:#e5e7eb}
    a{color:#93c5fd}
    .container{max-width:1160px;margin:auto;padding:20px}
    .card{background:#12182b;padding:20px;border-radius:16px;margin-bottom:16px;
          border:1px solid #1f2937;box-shadow:0 6px 18px rgba(0,0,0,.3)}
    .btn{padding:8px 14px;border-radius:8px;cursor:pointer;
         background:#1f2937;color:#e5e7eb;border:1px solid #334155}
    .btn.primary{background:linear-gradient(135deg,#2563eb,#22d3ee);border:none}
    .btn.danger{background:#7f1d1d;border:1px solid #ef4444}
    .btn:hover{filter:brightness(1.1)}
    .input,textarea{width:100%;padding:10px;background:#0b1020;color:#fff;
                    border:1px solid #334155;border-radius:8px}
    .pill{background:#1f2937;border:1px solid #334155;padding:6px 10px;
          border-radius:999px;display:inline-block}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .hidden{display:none}
    .cloud span{display:inline-block;margin:6px;font-weight:900}
    .bar{height:28px;margin:6px 0;background:#334155;border-radius:6px;overflow:hidden}
    .bar-inner{height:100%;text-align:right;padding-right:6px;font-size:14px;
               line-height:28px;color:#fff;font-weight:700}
    #errbar{position:fixed;top:0;left:0;right:0;background:#7f1d1d;color:#fff;
            padding:6px 10px;display:none;z-index:1000}
    #errbar button{margin-left:10px}
    table{width:100%;border-collapse:collapse;margin-top:10px}
    th,td{padding:8px;border-bottom:1px solid #334155;text-align:left}
    th{color:#93c5fd}
    tr:hover{background:#1e293b}
    .qrcode{background:#0a0f1f;border:1px solid #1f2937;border-radius:12px;
            padding:8px;display:inline-block}
    .copy{padding:4px 10px;border-radius:6px;border:1px solid #334155;
          background:#0f172a;cursor:pointer}
    .copy.ok{background:#14532d;border-color:#16a34a}
  </style>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <!-- SheetJS for XLSX 匯出 -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
<!-- 錯誤提示面板 -->
<div id="errbar">⚠️ <span id="errmsg"></span>
  <button onclick="copyErr()">複製錯誤</button></div>

<div class="container">
  <h1>即時互動平台</h1>

  <!-- 首頁 -->
  <div id="view-home" class="grid">
    <div class="card"><h3>1) 新增問答</h3>
      <button class="btn primary" onclick="goto('#/new')">前往</button></div>
    <div class="card"><h3>2) 編輯問答 (10個存檔)</h3>
      <button class="btn" onclick="goto('#/edit')">前往</button></div>
    <div class="card"><h3>3) 顯示即時頁面</h3>
      <button class="btn" onclick="goto('#/display')">前往</button></div>
    <div class="card"><h3>4) 快速試玩</h3>
      <button class="btn" onclick="goto('#/demo')">前往</button></div>
  </div>

  <!-- 新增問答 -->
  <div id="view-new" class="hidden card">
    <h2>新增問答</h2>
    <input class="input" id="new-question" placeholder="輸入題目"/>
    <div class="row" style="margin:10px 0">
      <label><input type="radio" name="qtype" value="qa" checked/> 問答蒐集</label>
      <label><input type="radio" name="qtype" value="cloud"/> 文字雲</label>
      <label><input type="radio" name="qtype" value="poll"/> 投票</label>
    </div>
    <textarea class="input hidden" id="new-options" rows="3" 
              placeholder="投票選項，每行一個"></textarea>
    <button class="btn primary" onclick="createQuestion()">建立題目</button>
    <div id="new-info"></div>
  </div>

  <!-- 編輯問答 -->
  <div id="view-edit" class="hidden card">
    <h2>編輯問答 (最多保留10個)</h2>
    <div id="edit-list"></div>
  </div>

  <!-- 顯示即時頁面 -->
  <div id="view-display" class="hidden card">
    <h2>顯示即時頁面</h2>
    <div id="display-question"></div>
    <div id="display-area"></div>
  </div>

  <!-- 快速試玩 -->
  <div id="view-demo" class="hidden card">
    <h2>快速試玩</h2>
    <textarea class="input" id="demo-input" rows="4" 
              placeholder="輸入字詞 (逗號/換行分隔)"></textarea>
    <button class="btn primary" onclick="runDemo()">產生文字雲</button>
    <div id="demo-cloud" class="cloud"></div>
  </div>
</div>
<script>
/* ===== 全域錯誤處理 ===== */
window.addEventListener('error', e => showErr(e.message));
window.addEventListener('unhandledrejection', e => showErr(e.reason));

function showErr(msg){
  const bar=document.getElementById('errbar');
  document.getElementById('errmsg').textContent=msg;
  bar.style.display='block';
}
function copyErr(){
  navigator.clipboard.writeText(document.getElementById('errmsg').textContent);
}

/* ===== Firebase 初始化 ===== */
const firebaseConfig={
  apiKey:"AIzaSyBwC8CpjB_OjIhH2Vtw5BALzLbqwBb-oP8",
  authDomain:"ai-test-ac0b6.firebaseapp.com",
  projectId:"ai-test-ac0b6"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

/* ===== 小工具 ===== */
const $=s=>document.querySelector(s);
function goto(h){location.hash=h}
function randColor(){return `hsl(${Math.floor(Math.random()*360)},70%,55%)`;}
function splitInput(txt){return txt.split(/\n|,|，/).map(t=>t.trim()).filter(Boolean);}
function copyBtn(btn,txt){
  btn.onclick=async()=>{
    await navigator.clipboard.writeText(txt());
    btn.classList.add('ok');
    setTimeout(()=>btn.classList.remove('ok'),800);
  }
}

/* ===== 路由控制 ===== */
window.addEventListener('hashchange',router);
window.addEventListener('load',router);

function router(){
  ['view-home','view-new','view-edit','view-display','view-demo']
    .forEach(id=>$('#'+id).classList.add('hidden'));
  const [p]=location.hash.replace('#/','').split('/');
  if(!p){$('#view-home').classList.remove('hidden');return;}
  if(p==='new')$('#view-new').classList.remove('hidden');
  if(p==='edit')loadEdit();
  if(p==='display')loadDisplay();
  if(p==='demo')$('#view-demo').classList.remove('hidden');
}
</script>
<script>
/* ===== 新增問答 ===== */
document.querySelectorAll('input[name=qtype]').forEach(r=>{
  r.onchange=()=>$('#new-options').classList.toggle('hidden',r.value!=='poll');
});

async function createQuestion(){
  try{
    const prompt=$('#new-question').value.trim();
    if(!prompt){alert('請輸入題目');return;}
    const type=document.querySelector('input[name=qtype]:checked').value;
    const q={
      type,
      prompt,
      updatedAt:new Date(),
      expireAt:new Date(Date.now()+30*86400000)
    };
    if(type==='poll'){
      q.options=splitInput($('#new-options').value);
      if(q.options.length<2){alert('投票至少要有兩個選項');return;}
    }
    // Firestore: questions 集合
    const ref=await db.collection('questions').add(q);
    $('#new-info').innerHTML=`✅ 建立成功 ID=${ref.id}`;
    $('#new-question').value='';$('#new-options').value='';
  }catch(e){ showErr('建立題目失敗: '+e); }
}

/* ===== 編輯問答 ===== */
async function loadEdit(){
  $('#view-edit').classList.remove('hidden');
  const list=$('#edit-list');list.innerHTML='載入中…';
  try{
    const snap=await db.collection('questions')
      .orderBy('updatedAt','desc').limit(10).get();
    list.innerHTML='';
    if(snap.empty){list.textContent='尚無題目';return;}
    snap.forEach(doc=>{
      const d=doc.data();
      const div=document.createElement('div');div.className='card';
      let optHTML='';
      if(d.type==='poll' && d.options){
        optHTML='<div class="muted">選項：'+d.options.join('、')+'</div>';
      }
      div.innerHTML=`
        <div class="row" style="justify-content:space-between">
          <div>
            <b>${d.prompt}</b> <span class="pill">${d.type}</span><br/>
            <small>最後更新：${d.updatedAt?.toDate?d.updatedAt.toDate().toLocaleString():""}</small>
            ${optHTML}
          </div>
          <div class="row">
            <button class="btn" onclick="previewQ('${doc.id}')">預覽</button>
            <button class="btn danger" onclick="delQ('${doc.id}')">刪除</button>
          </div>
        </div>`;
      list.appendChild(div);
    });
  }catch(e){ showErr('載入題目失敗: '+e); }
}

async function delQ(id){
  if(!confirm('確定要刪除這個題目？'))return;
  try{
    await db.collection('questions').doc(id).delete();
    loadEdit();
  }catch(e){ showErr('刪除失敗: '+e); }
}

async function previewQ(id){
  try{
    const doc=await db.collection('questions').doc(id).get();
    if(!doc.exists){alert('題目不存在');return;}
    const d=doc.data();
    alert(`題目：${d.prompt}\n類型：${d.type}`);
  }catch(e){ showErr('預覽失敗: '+e); }
}
</script>
<script>
/* ===== 顯示即時頁面 ===== */
async function loadDisplay(){
  $('#view-display').classList.remove('hidden');
  const qs=await db.collection('questions').orderBy('updatedAt','desc').limit(1).get();
  if(qs.empty){$('#display-question').textContent='尚無題目';return;}
  const qid=qs.docs[0].id;
  const q=qs.docs[0].data();
  $('#display-question').innerHTML=`<h3>${q.prompt}</h3><span class="pill">${q.type}</span>`;
  if(q.type==='qa') renderQA(qid);
  if(q.type==='cloud') renderCloud(qid);
  if(q.type==='poll') renderPoll(qid,q.options||[]);
}

/* 問答蒐集 */
function renderQA(qid){
  db.collection('questions').doc(qid).collection('responses')
    .orderBy('ts').onSnapshot(s=>{
      const div=$('#display-area');div.innerHTML='';
      s.forEach(doc=>{
        const d=doc.data();
        const row=document.createElement('div');row.className='row';
        const msg=document.createElement('div');msg.textContent=d.text;
        msg.style.flex='1';
        const btn=document.createElement('button');btn.textContent='❌';
        btn.className='btn danger';btn.onclick=()=>doc.ref.delete();
        row.appendChild(msg);row.appendChild(btn);
        div.appendChild(row);
      });
    });
}

/* 文字雲 */
function renderCloud(qid){
  db.collection('questions').doc(qid).collection('responses')
    .onSnapshot(s=>{
      const counts={};
      s.forEach(doc=>{
        const t=(doc.data().text||'').trim();
        if(t) counts[t]=(counts[t]||0)+1;
      });
      const arr=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
      const div=$('#display-area');div.className='cloud';div.innerHTML='';
      if(arr.length===0){div.textContent='尚無資料';return;}
      const max=arr[0][1],min=arr[arr.length-1][1];
      arr.forEach(([w,f])=>{
        const span=document.createElement('span');
        const size=18+((f-min)/(max-min||1))*100;
        span.style.fontSize=size+'px';
        span.style.color=randColor();
        span.textContent=w;
        div.appendChild(span);
      });
    });
}

/* 投票長條圖 */
function renderPoll(qid,opts){
  db.collection('questions').doc(qid).collection('responses')
    .onSnapshot(s=>{
      const counts={};opts.forEach(o=>counts[o]=0);
      s.forEach(doc=>{
        const o=doc.data().option;
        if(o && counts[o]!=null) counts[o]++;
      });
      const div=$('#display-area');div.innerHTML='';
      Object.entries(counts).forEach(([opt,c])=>{
        const bar=document.createElement('div');bar.className='bar';
        const inner=document.createElement('div');inner.className='bar-inner';
        const max=Math.max(...Object.values(counts));
        const pct=max? (c/max*100):0;
        inner.style.width=pct+'%';
        inner.style.background=randColor();
        inner.textContent=`${opt}: ${c}`;
        bar.appendChild(inner);div.appendChild(bar);
      });
    });
}
</script>
<script>
/* ===== 匯出 XLSX ===== */
async function exportXLSX(currentOnly=false){
  try{
    const qs=await db.collection('questions')
      .orderBy('updatedAt','desc').limit(currentOnly?1:10).get();
    if(qs.empty){alert('沒有題目');return;}
    const wb=XLSX.utils.book_new();

    for(const doc of qs.docs){
      const qid=doc.id,d=doc.data();
      const rows=[["ID",qid],["題目",d.prompt],["類型",d.type]];
      if(d.type==='poll') rows.push(["選項", (d.options||[]).join(" / ")]);
      const wsInfo=XLSX.utils.aoa_to_sheet(rows);
      XLSX.utils.book_append_sheet(wb,wsInfo,"Q_"+qid+"_info");

      const rs=await db.collection('questions').doc(qid).collection('responses').get();
      const arr=[["內容","選項","時間"]];
      rs.forEach(r=>{
        const dd=r.data();
        arr.push([dd.text||"",dd.option||"",dd.ts?dd.ts.toDate().toLocaleString():""]);
      });
      const wsRes=XLSX.utils.aoa_to_sheet(arr);
      XLSX.utils.book_append_sheet(wb,wsRes,"Q_"+qid+"_res");
    }
    XLSX.writeFile(wb,"questions_export.xlsx");
  }catch(e){showErr("匯出失敗: "+e);}
}

/* ===== TTL 模擬 (30天) ===== */
/* Firestore 本身有 TTL 功能，這裡在寫入時就加 expireAt 欄位 */
function withTTL(data){
  return {...data,expireAt:new Date(Date.now()+30*86400000)};
}

/* ===== Demo ===== */
function runDemo(){
  const tokens=$('#demo-input').value.split(/,|\n/).map(t=>t.trim()).filter(Boolean);
  const counts={};tokens.forEach(t=>counts[t]=(counts[t]||0)+1);
  const arr=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  const div=$('#demo-cloud');div.innerHTML='';
  if(arr.length===0){div.textContent='尚無資料';return;}
  const max=arr[0][1],min=arr[arr.length-1][1];
  arr.forEach(([w,f])=>{
    const span=document.createElement('span');
    const size=18+((f-min)/(max-min||1))*100;
    span.style.fontSize=size+'px';
    span.style.color=randColor();
    span.textContent=w;
    div.appendChild(span);
  });
}
</script>
</body>
</html>
