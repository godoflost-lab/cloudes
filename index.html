<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>即時互動平台</title>
<style>
  :root{
    --bg:#0b1020;--text:#e5e7eb;--card:#12182b;--border:#1f2937;--muted:#94a3b8;
    --btn:#1f2937;--btn-border:#334155;--pill:#0f172a;--pill-border:#26314d;
    --bar:#1f2937;--bar-border:#334155;--danger:#7f1d1d;--danger-border:#ef4444;
  }
  body.light{
    --bg:#f6f8fb;--text:#0b1020;--card:#ffffff;--border:#d6dee8;--muted:#64748b;
    --btn:#e9eef5;--btn-border:#cfd8e3;--pill:#eef2f7;--pill-border:#cfd8e3;
    --bar:#e8eef6;--bar-border:#cfd8e3;--danger:#fee2e2;--danger-border:#ef4444;
  }
  body{margin:0;font-family:system-ui,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--text)}
  a{color:#3b82f6}
  .container{max-width:1280px;margin:auto;padding:20px}
  .card{background:var(--card);padding:20px;border-radius:16px;margin-bottom:16px;border:1px solid var(--border);box-shadow:0 6px 18px rgba(0,0,0,.25)}
  .btn{padding:8px 14px;border-radius:8px;cursor:pointer;background:var(--btn);color:var(--text);border:1px solid var(--btn-border)}
  .btn.primary{background:linear-gradient(135deg,#2563eb,#22d3ee);border:none;color:#fff}
  .btn.danger{background:var(--danger);border:1px solid var(--danger-border);color:#7f1d1d}
  .btn.ghost{background:transparent;border:1px dashed var(--btn-border)}
  .btn:hover{filter:brightness(1.06)}
  .input,textarea{width:100%;padding:10px;background:var(--bg);color:var(--text);border:1px solid var(--btn-border);border-radius:8px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .hidden{display:none}
  .pill{background:var(--pill);border:1px solid var(--pill-border);padding:6px 10px;border-radius:999px;display:inline-flex;gap:8px;align-items:center}
  .two-col{display:flex;gap:20px}
  .sidebar{width:320px;background:var(--pill);padding:12px;border-radius:12px;border:1px solid var(--pill-border);max-height:78vh;overflow:auto}
  .q-item{padding:10px;border-radius:10px;border:1px solid var(--btn-border);margin-bottom:8px;cursor:grab;background:var(--card)}
  .q-item.dragging{opacity:.5}
  .q-item:hover{outline:2px solid #3b82f6}
  .q-item.active{outline:3px solid #3b82f6}
  .mainpanel{flex:1;min-height:78vh}
  .qa-card{background:var(--bar);padding:10px 12px;margin:6px 0;border-radius:10px;display:flex;justify-content:space-between;gap:10px;border:1px solid var(--bar-border)}
  .qa-card.muted{opacity:.5}
  .cloud span{display:inline-block;margin:6px;font-weight:900}
  .bar{height:28px;margin:8px 0;background:var(--bar);border-radius:8px;overflow:hidden;border:1px solid var(--bar-border)}
  .bar-inner{height:100%;text-align:right;padding-right:8px;font-size:14px;line-height:28px;color:#fff;font-weight:800}
  /* 左上角 QR 固定角標 */
  .qr-corner{position:fixed;left:16px;top:16px;z-index:2000;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
  .qr-corner img{width:96px;height:96px;display:block;border-radius:8px}
  .qr-corner .link{max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;margin-top:6px}
  .copy{padding:4px 10px;border-radius:6px;border:1px solid var(--btn-border);background:var(--pill);cursor:pointer}
  .copy.ok{background:#14532d;border-color:#16a34a;color:#fff}
  /* 錯誤條 */
  #errbar{position:fixed;top:0;left:0;right:0;background:#b91c1c;color:#fff;padding:8px 12px;display:none;z-index:3000}
  #errbar button{margin-left:10px}
</style>

<!-- Firebase & XLSX -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
<div id="errbar">⚠️ <span id="errmsg"></span> <button class="btn" onclick="copyErr()">複製錯誤</button></div>

<div class="container">
  <h1>即時互動平台</h1>

  <!-- 全域工具列 -->
  <div class="row card" style="justify-content:space-between;margin-top:8px">
    <div class="row">
      <button class="btn" onclick="goto('#/')">回到首頁</button>
    </div>
    <div class="row">
      <button class="btn" onclick="quickShowQR()">顯示 QR</button>
      <button class="btn" onclick="copyCurrentJoin()">複製參與連結</button>
    </div>
  </div>

  <!-- 首頁 -->
  <div id="view-home" class="grid">
    <div class="card"><h3>1) 新增問答</h3><button class="btn primary" onclick="goto('#/new')">前往</button></div>
    <div class="card"><h3>2) 編輯問答（10個存檔）</h3><button class="btn" onclick="goto('#/edit')">前往</button></div>
    <div class="card"><h3>3) 顯示即時頁面</h3><button class="btn" onclick="goto('#/display')">前往</button></div>
    <div class="card"><h3>4) 快速試玩</h3><button class="btn" onclick="goto('#/demo')">前往</button></div>
  </div>

  <!-- 新增問答 -->
  <div id="view-new" class="hidden card">
    <h2>新增問答</h2>
    <div class="row">
      <input class="input" id="new-room" placeholder="房號（可留空，稍後再指定）" style="max-width:240px"/>
      <span class="muted">相同房號的題目會聚在一起列於顯示頁清單</span>
    </div>
    <input class="input" id="new-question" placeholder="輸入題目"/>
    <div class="row" style="margin:8px 0">
      <label><input type="radio" name="qtype" value="qa" checked/> 問答蒐集</label>
      <label><input type="radio" name="qtype" value="cloud"/> 文字雲</label>
      <label><input type="radio" name="qtype" value="poll"/> 投票</label>
    </div>
    <textarea class="input hidden" id="new-options" rows="3" placeholder="【投票】選項，每行一個"></textarea>
    <div class="row" style="margin-top:6px"><button class="btn primary" onclick="createQuestion()">建立題目</button></div>
    <div id="new-info" class="muted" style="margin-top:8px"></div>
  </div>

  <!-- 編輯問答 -->
  <div id="view-edit" class="hidden card">
    <h2>編輯問答（最多 10 個）</h2>
    <div class="row" style="margin:8px 0">
      <input class="input" id="edit-room" placeholder="輸入房號過濾清單" style="max-width:240px"/>
      <button class="btn" onclick="loadEdit()">載入</button>
      <button class="btn" onclick="exportXLSX(false)">匯出該房號全部 .xlsx</button>
      <label class="pill"><input type="checkbox" id="show-deleted"> 顯示已刪除</label>
    </div>

    <!-- 多選工具列 -->
    <div class="row" style="margin:6px 0">
      <label><input type="checkbox" id="pick-all"> 全選/全不選</label>
      <input class="input" id="pick-room" placeholder="指定/新建房號" style="max-width:200px">
      <button class="btn primary" onclick="createRoomFromSelection()">用所選建立/更新房號並演示</button>
      <button class="btn" onclick="showQRForSelection()">顯示所選 QR</button>
    </div>

    <div id="edit-list"></div>
  </div>

  <!-- 顯示頁面（Slido 風格） -->
  <div id="view-display" class="hidden">
    <div class="row card" style="justify-content:space-between">
      <div class="row">
        <input class="input" id="display-room" placeholder="輸入房號或建立" style="max-width:200px"/>
        <button class="btn" id="btn-room-create">建立房號</button>
        <button class="btn primary" id="btn-room-enter">進入</button>
        <span class="pill">當前題：<span id="cur-q-label">—</span></span>
      </div>
      <div class="row">
        <label class="pill">主題：
          <select id="themeSel" class="input" style="width:auto;padding:6px">
            <option value="dark">深色</option>
            <option value="light">淺色</option>
          </select>
        </label>
        <button class="btn" onclick="exportXLSX(true)">匯出當前題 .xlsx</button>
      </div>
    </div>

    <div class="two-col">
      <div class="sidebar" id="sidebar"></div>
      <div class="mainpanel">
        <div class="card">
          <div class="row" style="justify-content:space-between;align-items:flex-start">
            <div id="display-header"><h3>請從左側選擇題目</h3></div>
            <div class="row">
              <span class="pill">房號：<b id="room-badge">—</b></span>
              <button class="btn" id="btn-copy-room">複製房號</button>
              <button class="btn" id="btn-copy-join">複製參與連結</button>
              <!-- 敏感詞控制 -->
              <details style="margin-left:6px">
                <summary class="pill" style="cursor:pointer">敏感詞設定</summary>
                <div style="margin-top:8px">
                  <textarea class="input" id="badwords" rows="3" placeholder="逗號或換行分隔"></textarea>
                  <div class="row" style="margin-top:6px">
                    <button class="btn" onclick="saveBadwords()">儲存到房號</button>
                    <button class="btn" onclick="hideAllBad()">一鍵隱藏不雅內容</button>
                    <label class="pill"><input type="checkbox" id="show-hidden"> 顯示已隱藏</label>
                  </div>
                </div>
              </details>
            </div>
          </div>
          <div id="display-area" style="margin-top:10px"></div>
        </div>
      </div>
    </div>

    <!-- 左上角固定 QR 角標 -->
    <div id="qrCorner" class="qr-corner hidden">
      <img id="qrImg" alt="QR"/>
      <div class="link" id="qrLink"></div>
      <button class="copy" id="btn-copy-corner">複製連結</button>
    </div>
  </div>

  <!-- 參與者頁 -->
  <div id="view-join" class="hidden card">
    <h2>參與作答</h2>
    <div class="pill">房號：<span id="j-room">—</span></div>
    <div class="pill" id="j-prompt">—</div>
    <div id="j-area" style="margin-top:10px"></div>
    <div id="j-status" class="muted" style="margin-top:8px"></div>
  </div>

  <!-- 快速試玩 -->
  <div id="view-demo" class="hidden card">
    <h2>快速試玩（本地）</h2>
    <textarea class="input" id="demo-input" rows="4" placeholder="輸入字詞（逗號/換行分隔）"></textarea>
    <button class="btn primary" onclick="runDemo()">產生文字雲</button>
    <div id="demo-cloud" class="cloud" style="min-height:240px;margin-top:8px"></div>
  </div>
</div>

<script>
/* ========== 錯誤面板 ========== */
window.addEventListener('error',e=>showErr(e.message));
window.addEventListener('unhandledrejection',e=>showErr(e.reason));
function showErr(msg){document.getElementById('errmsg').textContent=String(msg||'');document.getElementById('errbar').style.display='block';}
function copyErr(){navigator.clipboard.writeText(document.getElementById('errmsg').textContent);}

/* ========== Firebase ========== */
firebase.initializeApp({apiKey:"AIzaSyBwC8CpjB_OjIhH2Vtw5BALzLbqwBb-oP8",authDomain:"ai-test-ac0b6.firebaseapp.com",projectId:"ai-test-ac0b6"});
const db=firebase.firestore();

/* ========== 工具 ========== */
const $=s=>document.querySelector(s);
const DAY=86400000;
const ttlDays=30;
const withTTL=obj=>({...obj,expireAt:new Date(Date.now()+ttlDays*DAY)});
const encodeQR=url=>`https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(url)}`;
function goto(h){location.hash=h}
function splitInput(t){return (t||'').split(/\n|,|，/).map(s=>s.trim()).filter(Boolean);}
function randId(n=6){return Math.random().toString(36).slice(2,2+n).toUpperCase();}
function hashHue(str){let h=5381;for(let i=0;i<str.length;i++){h=((h<<5)+h)+str.charCodeAt(i);h|=0;}return (h>>>0)%360;}
const colorOf=w=>`hsl(${hashHue(w)},72%,56%)`;
const pollColors=['#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#84cc16','#f43f5e'];
const containsBad=(text,bads)=>bads.some(w=>w && text.toLowerCase().includes(w.toLowerCase()));

/* ========== 主題切換（顯示頁） ========== */
(function(){
  const saved=localStorage.getItem('theme')||'dark';
  document.body.classList.toggle('light',saved==='light');
  window.addEventListener('load',()=>{const sel=$('#themeSel'); if(sel){sel.value=saved; sel.onchange=()=>{const v=sel.value;document.body.classList.toggle('light',v==='light');localStorage.setItem('theme',v);};}});
})();

/* ========== 路由 ========== */
window.addEventListener('hashchange',router);window.addEventListener('load',router);
function router(){
  ['view-home','view-new','view-edit','view-display','view-demo','view-join'].forEach(id=>$('#'+id).classList.add('hidden'));
  const parts=location.hash.replace(/^#\/?/,'').split('/');
  const p=parts[0]||''; const a=parts[1];
  if(!p){$('#view-home').classList.remove('hidden');return;}
  if(p==='new')$('#view-new').classList.remove('hidden');
  if(p==='edit')loadEdit();
  if(p==='display'){ $('#view-display').classList.remove('hidden'); initDisplay(a); }
  if(p==='join'){ $('#view-join').classList.remove('hidden'); initJoin(a); }
  if(p==='demo')$('#view-demo').classList.remove('hidden');
}

/* ========== 新增題目 ========== */
document.querySelectorAll('input[name=qtype]').forEach(r=>{
  r.onchange=()=>$('#new-options').classList.toggle('hidden',r.value!=='poll');
});
async function createQuestion(){
  try{
    const prompt=$('#new-question').value.trim(); if(!prompt){alert('請輸入題目');return;}
    const roomId=$('#new-room').value.trim();
    const type=document.querySelector('input[name=qtype]:checked').value;
    const q=withTTL({roomId:roomId||null,type,prompt,options:[],createdAt:new Date(),updatedAt:new Date(),deleted:false});
    if(type==='poll'){
      q.options=splitInput($('#new-options').value);
      if(q.options.length<2){alert('投票至少需要兩個選項');return;}
    }
    const ref=await db.collection('questions').add(q);
    if(roomId){ await db.collection('rooms').doc(roomId).set(withTTL({roomId,updatedAt:new Date()}),{merge:true}); }
    $('#new-info').innerHTML=`✅ 建立成功（ID: ${ref.id}）${roomId?`，已歸屬房號 ${roomId}`:''}`;
    $('#new-question').value='';$('#new-options').value='';
  }catch(e){showErr('建立題目失敗：'+e);}
}

/* ========== 編輯問答（最近 10） ========== */
async function loadEdit(){
  try{
    $('#view-edit').classList.remove('hidden');
    const room=$('#edit-room').value.trim();
    const list=$('#edit-list'); list.innerHTML='載入中…';
    let q=db.collection('questions').orderBy('updatedAt','desc').limit(30);
    const snap=await q.get(); list.innerHTML='';
    if(snap.empty){list.textContent='（沒有題目）';return;}
    const showDeleted=$('#show-deleted').checked;

    // 客端過濾
    const items=snap.docs
      .map(d=>({id:d.id,data:d.data()}))
      .filter(o=>!room || (o.data.roomId===room))
      .filter(o=> showDeleted ? (o.data.deleted===true) : (o.data.deleted!==true))
      .slice(0,10);

    if(items.length===0){list.textContent='（無符合條件）';return;}

    items.forEach(({id,d})=>{
      const div=document.createElement('div');div.className='card';
      div.innerHTML=`
        <div class="row" style="justify-content:space-between">
          <div>
            <label class="row" style="gap:8px">
              <input type="checkbox" class="pick" data-id="${id}">
              <b>${d.prompt}</b> <span class="pill">${d.type}</span> ${d.deleted?'<span class="pill">已刪除</span>':''}
            </label>
            <div class="muted">房號：${d.roomId||'（未指定）'}　更新：${(d.updatedAt?.toDate?d.updatedAt.toDate():new Date(d.updatedAt)).toLocaleString?.()||''}</div>
            ${d.type==='poll' && d.options?.length ? `<div class="muted">選項：${d.options.join('、')}</div>` : ''}
          </div>
          <div class="row">
            <button class="btn" onclick="duplicateQ('${id}')">複製</button>
            ${d.deleted
              ? `<button class="btn" onclick="restoreQ('${id}')">恢復</button>`
              : `<button class="btn danger" onclick="softDeleteQ('${id}')">刪除</button>`}
            <button class="btn" onclick="assignRoom('${id}')">指定房號</button>
            <button class="btn" onclick="singleQR('${id}')">單題 QR</button>
          </div>
        </div>`;
      list.appendChild(div);
    });

    $('#pick-all')?.addEventListener('change',e=>{
      document.querySelectorAll('#edit-list .pick').forEach(cb=>cb.checked=e.target.checked);
    });
    $('#show-deleted').onchange=loadEdit;

  }catch(e){showErr('載入題目失敗：'+e);}
}
function selectedIds(){
  return Array.from(document.querySelectorAll('#edit-list .pick:checked'))
    .map(cb=>cb.getAttribute('data-id'));
}
async function assignRoom(qid){
  const rid=prompt('輸入房號（空白=移除房號）');
  try{
    await db.collection('questions').doc(qid).update(withTTL({roomId:rid||null,updatedAt:new Date()}));
    loadEdit();
  }catch(e){showErr('設定房號失敗：'+e);}
}
async function softDeleteQ(id){
  if(!confirm('將此題標記為「已刪除」？'))return;
  try{ await db.collection('questions').doc(id).update({deleted:true,updatedAt:new Date()}); loadEdit(); }
  catch(e){showErr('刪除失敗：'+e);}
}
async function restoreQ(id){
  try{ await db.collection('questions').doc(id).update({deleted:false,updatedAt:new Date()}); loadEdit(); }
  catch(e){showErr('恢復失敗：'+e);}
}
async function duplicateQ(id){
  try{
    const src=await db.collection('questions').doc(id).get(); const d=src.data();
    if(!d){alert('來源不存在');return;}
    const keep=confirm('複製並保留相同房號？按「確定」保留，取消為不指定房號');
    const copy=withTTL({...d,roomId:keep?d.roomId:null,createdAt:new Date(),updatedAt:new Date(),deleted:false});
    delete copy.ts; // 清理可能的額外欄位
    await db.collection('questions').add(copy);
    loadEdit();
  }catch(e){showErr('複製失敗：'+e);}
}

/* 多選建立/更新房號並演示 */
async function createRoomFromSelection(){
  try{
    const ids=selectedIds();
    if(ids.length===0){alert('請至少勾選一題');return;}
    const rid=($('#pick-room').value.trim()) || prompt('輸入房號（空白為自動產生）') || randId();
    const payload=withTTL({roomId:rid,playlist:ids,currentQ:ids[0],updatedAt:new Date()});
    await db.collection('rooms').doc(rid).set(payload,{merge:true});
    await Promise.all(ids.map(id=>db.collection('questions').doc(id).update(withTTL({roomId:rid,updatedAt:new Date()}))));
    location.hash = `#/display/${rid}`; setTimeout(()=>{ setQrCorner(rid); }, 400);
  }catch(e){showErr('建立/更新房號失敗：'+e);}
}
/* 顯示所選 QR（不跳轉） */
async function showQRForSelection(){
  try{
    const ids=selectedIds();
    if(ids.length===0){alert('請先勾選題目');return;}
    const rid=($('#pick-room').value.trim()) || prompt('輸入房號（空白為自動產生）') || randId();
    await db.collection('rooms').doc(rid).set(withTTL({roomId:rid,playlist:ids,currentQ:ids[0],updatedAt:new Date()}),{merge:true});
    setQrCorner(rid);
  }catch(e){showErr('顯示所選 QR 失敗：'+e);}
}
/* 單題 QR：建立只含此題的房號 */
async function singleQR(qid){
  try{
    const rid = prompt('輸入房號（空白為自動產生）') || randId();
    await db.collection('rooms').doc(rid).set(withTTL({roomId:rid,playlist:[qid],currentQ:qid,updatedAt:new Date()}),{merge:true});
    await db.collection('questions').doc(qid).update(withTTL({roomId:rid,updatedAt:new Date()}));
    setQrCorner(rid);
  }catch(e){showErr('建立單題房號失敗：'+e);}
}

/* ========== 顯示頁面 ========== */
let currentRoom=null,currentQId=null,unsubResp=null,roomBadwords=[];
function setQrCorner(roomId){
  const box=$('#qrCorner'); const link=`${location.origin}${location.pathname}#/join/${roomId}`;
  $('#qrImg').src=encodeQR(link); $('#qrLink').textContent=link;
  $('#btn-copy-corner').onclick=async()=>{await navigator.clipboard.writeText(link); const b=$('#btn-copy-corner');b.classList.add('ok');setTimeout(()=>b.classList.remove('ok'),800);}
  box.classList.remove('hidden');
  $('#btn-copy-room').onclick=async()=>{await navigator.clipboard.writeText(roomId);};
  $('#btn-copy-join').onclick=async()=>{await navigator.clipboard.writeText(link);};
}
async function initDisplay(roomFromHash){
  const input=$('#display-room'); const sidebar=$('#sidebar'); const roomBadge=$('#room-badge');
  const enter=async (rid)=>{
    if(!rid){alert('請輸入房號');return;}
    currentRoom=rid; roomBadge.textContent=rid; input.value=rid;
    sidebar.innerHTML='載入題目…';
    setQrCorner(rid);

    // 讀 rooms 取得 playlist 與 badwords
    const rdoc=await db.collection('rooms').doc(rid).get();
    const rdata=rdoc.data()||{};
    roomBadwords = Array.isArray(rdata.badwords)? rdata.badwords : [];
    $('#badwords').value = roomBadwords.join('\n');

    // 抓房號下題目
    const qs = await db.collection('questions').where('roomId','==',rid).get();
    let items = qs.docs
      .map(d=>({id:d.id,data:d.data()}))
      .filter(o=>o.data.deleted!==true);

    // 依 playlist 排序，沒有就用更新時間
    if(Array.isArray(rdata.playlist) && rdata.playlist.length){
      const order=new Map(rdata.playlist.map((id,i)=>[id,i]));
      items.sort((a,b)=> (order.get(a.id)??999) - (order.get(b.id)??999));
    }else{
      items.sort((a,b)=> (b.data.updatedAt?.toMillis?.()||0) - (a.data.updatedAt?.toMillis?.()||0));
    }

    // 畫清單 + 拖曳能力
    sidebar.innerHTML='';
    items.forEach(({id,data})=>{
      const div=document.createElement('div');div.className='q-item';div.dataset.id=id;div.draggable=true;
      div.textContent=data.prompt;
      div.onclick=()=>showQ(id,data,true);
      sidebar.appendChild(div);
    });
    enableDND(sidebar, rid);

    // 若有 currentQ，自動顯示
    if(rdata.currentQ){
      const hit=items.find(it=>it.id===rdata.currentQ);
      if(hit) showQ(hit.id,hit.data,false);
    }
  };
  $('#btn-room-create').onclick=()=>{ const rid=randId(); input.value=rid; };
  $('#btn-room-enter').onclick=()=>enter(input.value.trim());
  if(roomFromHash){ input.value=roomFromHash; enter(roomFromHash); }
}

/* 拖曳排序 */
function enableDND(container, rid){
  let dragEl=null;
  container.querySelectorAll('.q-item').forEach(el=>{
    el.addEventListener('dragstart',e=>{dragEl=el; el.classList.add('dragging');});
    el.addEventListener('dragend',e=>{el.classList.remove('dragging'); dragEl=null; savePlaylist(container,rid);});
  });
  container.addEventListener('dragover',e=>{
    e.preventDefault();
    const afterEl=getDragAfterElement(container,e.clientY);
    if(!dragEl) return;
    if(afterEl==null){ container.appendChild(dragEl); }
    else{ container.insertBefore(dragEl,afterEl); }
  });
  function getDragAfterElement(c,y){
    const els=[...c.querySelectorAll('.q-item:not(.dragging)')];
    return els.reduce((closest,child)=>{
      const box=child.getBoundingClientRect();
      const offset=y-box.top-box.height/2;
      if(offset<0 && offset>closest.offset){ return {offset,element:child}; }
      else return closest;
    },{offset:Number.NEGATIVE_INFINITY}).element;
  }
}
async function savePlaylist(container,rid){
  const ids=[...container.querySelectorAll('.q-item')].map(x=>x.dataset.id);
  await db.collection('rooms').doc(rid).set(withTTL({playlist:ids,updatedAt:new Date()}),{merge:true});
}

function markActiveInSidebar(qid){
  document.querySelectorAll('.q-item').forEach(x=>x.classList.remove('active'));
  const el=[...document.querySelectorAll('.q-item')].find(x=>x.dataset.id===qid);
  if(el) el.classList.add('active');
}
async function showQ(qid,data,fromClick=false){
  currentQId=qid; markActiveInSidebar(qid);
  if(fromClick && currentRoom){
    await db.collection('rooms').doc(currentRoom).set(withTTL({roomId:currentRoom,currentQ:qid,updatedAt:new Date()}),{merge:true});
  }
  $('#cur-q-label').textContent=data.prompt||'—';
  $('#display-header').innerHTML=`<h3>${data.prompt}</h3><span class="pill">${data.type}</span>`;
  const area=$('#display-area'); if(unsubResp){unsubResp(); unsubResp=null;} area.innerHTML='';
  if(data.type==='qa') unsubResp=renderQA(qid,area);
  if(data.type==='cloud') unsubResp=renderCloud(qid,area);
  if(data.type==='poll') unsubResp=renderPoll(qid,data.options||[],area);
}

/* 敏感詞 */
async function saveBadwords(){
  if(!currentRoom){alert('尚未選擇房號');return;}
  const words=splitInput($('#badwords').value.replace(/，/g,',').replace(/\n/g,','));
  roomBadwords=words;
  await db.collection('rooms').doc(currentRoom).set(withTTL({badwords:words,updatedAt:new Date()}),{merge:true});
  alert('敏感詞已儲存');
}
async function hideAllBad(){
  if(!currentQId){alert('請先選擇題目');return;}
  const snap=await db.collection('questions').doc(currentQId).collection('responses').get();
  const batch=[];
  snap.forEach(d=>{
    const v=d.data(); const t=(v.text||'').toString();
    if(t && containsBad(t,roomBadwords)) batch.push(d.ref.update({hidden:true,flagged:true}));
  });
  await Promise.all(batch);
  alert('已隱藏命中敏感詞的內容');
}

/* 顯示頁：三種渲染 */
function renderQA(qid,area){
  const showHidden=$('#show-hidden');
  return db.collection('questions').doc(qid).collection('responses').orderBy('ts').onSnapshot(s=>{
    area.innerHTML='';
    s.forEach(doc=>{
      const d=doc.data();
      const text=(d.text||'').toString();
      const isBad = containsBad(text,roomBadwords);
      const hidden = d.hidden===true && !showHidden.checked;
      if(hidden) return;
      const card=document.createElement('div'); card.className='qa-card'+(isBad?' muted':'');
      const msg=document.createElement('div'); msg.textContent=text; msg.style.flex='1';
      const btns=document.createElement('div'); btns.className='row';
      const hideBtn=document.createElement('button'); hideBtn.className='btn'; hideBtn.textContent=d.hidden?'恢復可見':'隱藏';
      hideBtn.onclick=()=>doc.ref.update({hidden:!d.hidden});
      const delBtn=document.createElement('button'); delBtn.className='btn danger'; delBtn.textContent='刪除'; delBtn.onclick=()=>doc.ref.delete();
      btns.appendChild(hideBtn); btns.appendChild(delBtn);
      card.appendChild(msg); card.appendChild(btns); area.appendChild(card);
    });
  },err=>showErr('訂閱 QA 失敗：'+err));
}
function renderCloud(qid,area){
  return db.collection('questions').doc(qid).collection('responses').onSnapshot(s=>{
    const counts={}; s.forEach(doc=>{ const t=(doc.data().text||'').trim(); if(t) counts[t]=(counts[t]||0)+1; });
    area.classList.add('cloud'); area.innerHTML='';
    const arr=Object.entries(counts).sort((a,b)=>b[1]-a[1]); if(arr.length===0){area.textContent='尚無資料';return;}
    const max=arr[0][1],min=arr[arr.length-1][1];
    arr.forEach(([w,f])=>{ const span=document.createElement('span'); const size=18+Math.pow(((f-min)/(max-min||1)),0.75)*112;
      span.style.fontSize=size+'px'; span.style.color=colorOf(w); span.textContent=w; area.appendChild(span); });
  },err=>showErr('訂閱雲圖失敗：'+err));
}
function renderPoll(qid,opts,area){
  return db.collection('questions').doc(qid).collection('responses').onSnapshot(s=>{
    const counts={}; opts.forEach((o,i)=>counts[o]=0);
    s.forEach(doc=>{ const o=doc.data().option; if(o!=null && counts[o]!=null) counts[o]++; });
    area.innerHTML='';
    const total=Object.values(counts).reduce((a,b)=>a+b,0)||1;
    Object.entries(counts).forEach(([opt,c],i)=>{ const bar=document.createElement('div');bar.className='bar';
      const inner=document.createElement('div');inner.className='bar-inner'; inner.style.width=(c/total*100)+'%';
      inner.style.background=pollColors[i%pollColors.length]; inner.textContent=`${opt}：${c}  (${Math.round(c/total*100)}%)`;
      bar.appendChild(inner); area.appendChild(bar); });
  },err=>showErr('訂閱投票失敗：'+err));
}

/* ========== 參與者 join ========== */
function inputUI(tag,attrs={},parent){ const el=document.createElement(tag); Object.assign(el,attrs); parent&&parent.appendChild(el); return el; }
let joinUnsubRoom=null, joinCurrentQ=null, joinBadwords=[];
async function initJoin(roomId){
  const badge=$('#j-room'); const promptEl=$('#j-prompt'); const area=$('#j-area'); badge.textContent=roomId||'—';
  if(!roomId){
    const wrap=document.createElement('div'); const inp=inputUI('input',{className:'input',placeholder:'輸入房號'}); const btn=inputUI('button',{className:'btn primary',textContent:'前往'});
    btn.onclick=()=>{ if(!inp.value.trim()) return; location.hash=`#/join/${inp.value.trim()}`; };
    wrap.appendChild(inp); wrap.appendChild(btn); area.innerHTML=''; area.appendChild(wrap); return;
  }
  if(joinUnsubRoom) joinUnsubRoom();
  joinUnsubRoom = db.collection('rooms').doc(roomId).onSnapshot(async s=>{
    const d=s.data(); joinBadwords = Array.isArray(d?.badwords)? d.badwords : [];
    if(!d||!d.currentQ){ promptEl.textContent='主持人尚未選題'; area.innerHTML=''; return; }
    const qid=d.currentQ; if(joinCurrentQ===qid) return; joinCurrentQ=qid;
    const qDoc=await db.collection('questions').doc(qid).get(); const q=qDoc.data(); if(!q){promptEl.textContent='題目不存在'; area.innerHTML=''; return;}
    promptEl.textContent=q.prompt||''; renderJoinInput(roomId,qDoc.id,q,area);
  },err=>showErr('訂閱房號失敗：'+err));
}
function renderJoinInput(roomId,qid,q,container){
  container.innerHTML='';
  if(q.type==='qa' || q.type==='cloud'){
    const ta=document.createElement('textarea'); ta.className='input'; ta.rows=3; ta.placeholder='輸入內容';
    const btn=document.createElement('button'); btn.className='btn primary'; btn.textContent='送出';
    btn.onclick=async()=>{ const text=ta.value.trim(); if(!text){alert('請輸入內容');return;}
      const hit = containsBad(text,joinBadwords);
      await db.collection('questions').doc(qid).collection('responses').add(withTTL({roomId,text,hidden:hit,flagged:hit,ts:firebase.firestore.FieldValue.serverTimestamp()}));
      ta.value=''; $('#j-status').textContent= hit?'已送出（待審）':'已送出'; setTimeout(()=>$('#j-status').textContent='',1200);
    };
    container.appendChild(ta); container.appendChild(btn);
  }else if(q.type==='poll'){
    const wrap=document.createElement('div'); wrap.className='row';
    (q.options||[]).forEach(opt=>{
      const b=document.createElement('button'); b.className='btn'; b.textContent=opt;
      b.onclick=async()=>{ await db.collection('questions').doc(qid).collection('responses').add(withTTL({roomId,option:opt,ts:firebase.firestore.FieldValue.serverTimestamp()}));
        $('#j-status').textContent='已投票'; setTimeout(()=>$('#j-status').textContent='',1200);
      };
      wrap.appendChild(b);
    });
    container.appendChild(wrap);
  }
}

/* ========== 匯出 XLSX ========== */
async function exportXLSX(currentOnly){
  try{
    const wb=XLSX.utils.book_new();
    const rid=$('#display-room').value.trim() || $('#edit-room').value.trim();
    if(!rid){alert('請先輸入房號');return;}
    const qsRef=db.collection('questions').where('roomId','==',rid);
    if(currentOnly){
      if(!currentQId){alert('尚未選擇當前題');return;}
      const doc=await db.collection('questions').doc(currentQId).get();
      await appendQtoWB(wb,currentQId,doc.data());
    }else{
      const qs=await qsRef.get();
      // 依 rooms.playlist 排序
      const rdoc=await db.collection('rooms').doc(rid).get();
      const order=new Map((rdoc.data()?.playlist||[]).map((id,i)=>[id,i]));
      const docs=[...qs.docs].sort((a,b)=>(order.get(a.id)??999)-(order.get(b.id)??999));
      for(const doc of docs){ await appendQtoWB(wb,doc.id,doc.data()); }
    }
    XLSX.writeFile(wb,`room_${rid}_${currentOnly?'current':'all'}.xlsx`);
  }catch(e){showErr('匯出失敗：'+e);}
}
async function appendQtoWB(wb,qid,data){
  const ws1=XLSX.utils.aoa_to_sheet([["題目ID",qid],["類型",data.type],["房號",data.roomId||""],["題目",data.prompt],["建立/更新", (data.updatedAt?.toDate?data.updatedAt.toDate():new Date(data.updatedAt)).toLocaleString?.()||""],["刪除",data.deleted? "是":"否"]]);
  XLSX.utils.book_append_sheet(wb,ws1,"Q_"+qid+"_info");
  const rs=await db.collection('questions').doc(qid).collection('responses').get();
  const arr=[["roomId","text","option","hidden","flagged","time"]];
  rs.forEach(r=>{const d=r.data(); arr.push([d.roomId||"", d.text||"", d.option||"", d.hidden?1:0, d.flagged?1:0, d.ts? d.ts.toDate().toLocaleString(): ""]);});
  const ws2=XLSX.utils.aoa_to_sheet(arr); XLSX.utils.book_append_sheet(wb,ws2,"Q_"+qid+"_responses");
}

/* ========== 任何頁面都可叫出 QR/Join 連結 ========== */
function currentRoomGuess(){
  return ($('#display-room')?.value?.trim()) || ($('#edit-room')?.value?.trim()) || currentRoom || '';
}

    await db.collection('rooms').doc(rid).set(withTTL({roomId:rid,updatedAt:new Date()}),{merge:true});

async function copyCurrentJoin(){
  let rid=currentRoomGuess();
  if(!rid){alert('尚未指定房號');return;}
  const link=`${location.origin}${location.pathname}#/join/${rid}`;
  await navigator.clipboard.writeText(link);
}
